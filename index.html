<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Web de Pruebas - GTM</title>
  <!-- Google Tag Manager -->
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-MT3XMQ6M');</script>
  <!-- End Google Tag Manager -->
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MT3XMQ6M"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <h1>Bienvenido a mi web de pruebas</h1>
  <p>Esta web sirve para practicar Google Tag Manager, Meta Pixel y TikTok Pixel.</p>
  <button id="btn-lead">Quiero más información</button>
  <button id="btn-compra">Simular compra</button>

  <script>
    window.dataLayer = window.dataLayer || [];

    document.getElementById('btn-lead').addEventListener('click', function() {
      dataLayer.push({
        'event': 'generate_lead',
        'lead_type': 'formulario_info'
      });
      console.log('Evento enviado: generate_lead');
    });

    document.getElementById('btn-compra').addEventListener('click', function() {
      dataLayer.push({
        'event': 'purchase',
        'value': 99.90,
        'currency': 'PEN'
      });
      console.log('Evento enviado: purchase');
    });
  </script>
</body>
</html>
